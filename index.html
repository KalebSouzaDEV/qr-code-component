<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Interactive Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="map-container">
        <div class="map-wrapper">
            <div class="map-content" id="mapContent">
                <div class="map-grid">
                    <!-- Map grid will be generated by JavaScript -->
                </div>
                <div class="map-elements">
                    <!-- MTA map elements will be added here -->
                    <div class="location-marker" data-x="50" data-y="50">
                        <div class="marker-icon mta-marker"></div>
                        <span class="marker-label">Los Santos</span>
                    </div>
                    <div class="location-marker" data-x="30" data-y="30">
                        <div class="marker-icon mta-marker"></div>
                        <span class="marker-label">San Fierro</span>
                    </div>
                    <div class="location-marker" data-x="70" data-y="20">
                        <div class="marker-icon mta-marker"></div>
                        <span class="marker-label">Las Venturas</span>
                    </div>
                    <div class="location-marker" data-x="60" data-y="60">
                        <div class="marker-icon player-marker"></div>
                        <span class="marker-label">Player</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="map-controls">
            <button id="zoomIn" class="control-btn">+</button>
            <button id="zoomOut" class="control-btn">-</button>
            <button id="resetView" class="control-btn">⌂</button>
        </div>
        <div class="map-info">
            <div class="zoom-level">Zoom: <span id="zoomValue">1.0</span>x</div>
            <div class="coordinates">X: <span id="coordX">0</span> | Y: <span id="coordY">0</span></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
